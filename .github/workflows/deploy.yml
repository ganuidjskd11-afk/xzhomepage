name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy-pages 需要这两项权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，但不取消正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          # 只发布 public/ 里的内容，不会把 workflow、README 传上去
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
